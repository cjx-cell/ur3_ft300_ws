use_gazebo: true

# Keyboard commands are normalized to [-1, 1].  Fine/coarse mode is applied
# by the keyboard node; these are hard upper bounds enforced by Servo.
command_in_type: "unitless"
scale:
  # Free-space teleoperation ceiling.  Fine motion is selected in the
  # keyboard node before the normalized command reaches Servo.
  linear: 0.80
  rotational: 2.00
  joint: 0.80

publish_period: 0.02
low_latency_mode: false
command_out_type: std_msgs/Float64MultiArray
publish_joint_positions: true
publish_joint_velocities: false
publish_joint_accelerations: false
smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

is_primary_planning_scene_monitor: true
move_group_name: ur_manipulator
planning_frame: base_link
ee_frame_name: tool0
robot_link_command_frame: base_link

incoming_command_timeout: 0.12
num_outgoing_halt_msgs_to_publish: 5
lower_singularity_threshold: 40.0
hard_stop_singularity_threshold: 80.0
joint_limit_margin: 0.12
leaving_singularity_threshold_multiplier: 2.0

cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
joint_topic: /joint_states
status_topic: ~/status
command_out_topic: /arm_servo_controller/commands

check_collisions: true
collision_check_rate: 20.0
# The wrist D435 collision body can safely pass close to the forearm.  A
# 3 mm threshold drove Servo's cubic velocity scale below 2% before any
# collision occurred, effectively trapping manual teleoperation.  Preserve
# hard collision stopping while reducing only the self-proximity slowdown.
self_collision_proximity_threshold: 0.0002
scene_collision_proximity_threshold: 0.006
